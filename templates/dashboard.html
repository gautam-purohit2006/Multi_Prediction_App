<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">
                <i class="bi bi-heart-pulse-fill"></i>
                <h2>Multi Prediction</h2>
            </div>

            <ul>

                <li class="{% if active_page == 'index' %}active{% endif %}" onclick="location.href='/'">

                    <i class="bi bi-grid-fill"></i>
                    <span>Dashboard</span>

                </li>

                <li class="{% if active_page == 'car' %}active{% endif %}" onclick="location.href='/car'">

                    <i class="bi bi-car-front-fill"></i>
                    <span>Car Price</span>

                </li>

                <li class="{% if active_page == 'spam' %}active{% endif %}" onclick="location.href='/spam'">

                    <i class="bi bi-envelope-fill"></i>
                    <span>Spam Mail</span>

                </li>

                <li class="{% if active_page == 'diabetes' %}active{% endif %}" onclick="location.href='/diabetes'">

                    <i class="bi bi-droplet-half"></i>
                    <span>Diabetes</span>

                </li>

                <li class="{% if active_page == 'gold' %}active{% endif %}" onclick="location.href='/gold'">

                    <i class="bi bi-cash-stack"></i>
                    <span>Gold Price</span>

                </li>

                <li class="{% if active_page == 'heart' %}active{% endif %}"
                    onclick="location.href='/heart_prediction'">

                    <i class="bi bi-heart-pulse"></i>
                    <span>Heart Prediction</span>

                </li>

                <li class="{% if active_page == 'house' %}active{% endif %}"
                    onclick="location.href='/House_prediction'">

                    <i class="bi bi-buildings-fill"></i>
                    <!-- <i class="bi bi-house-door-fill"></i> -->
                    <span>House Prediction</span>

                </li>

                <li class="{% if active_page == 'employee_salary' %}active{% endif %}"
                    onclick="location.href='/emp'">

                    <i class="bi bi-person-workspace"></i>

                    <span>Employee Salary</span>

                </li>

            </ul>

        </aside>

        <!-- Right Side -->

        <main class="main">

            {% block content %}
            {% endblock %}

        </main>

    </div>

</body>

</html>
